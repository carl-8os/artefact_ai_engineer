[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "artefact-music-store-agent"
version = "0.1.0"
requires-python = ">=3.10"
description = "Domain-first implementation of the Emporio da Musica AI challenge"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
